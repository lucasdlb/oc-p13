<section class="history-card">
  <div class="history-header">
    <div>
      <p class="eyebrow">Historique</p>
    </div>

    <div class="navigation">
      <button
        type="button"
        class="nav-button"
        aria-label="Position precedente"
        aria-keyshortcuts="ArrowLeft"
        title="Position précédente (flèche gauche)"
        [disabled]="currentIndex() === 0"
        (click)="goBack.emit()"
      >
        &#8592;
      </button>
      <span class="position-indicator">{{ currentIndex() }} / {{ totalMoves() }}</span>
      <button
        type="button"
        class="nav-button"
        aria-label="Position suivante"
        aria-keyshortcuts="ArrowRight"
        title="Position suivante (flèche droite)"
        [disabled]="currentIndex() >= totalMoves()"
        (click)="goForward.emit()"
      >
        &#8594;
      </button>
      <button type="button" class="copy-button" (click)="copyPgn()" [attr.aria-label]="'Copier le PGN ' + (pgn() || 'Position initiale')">
        {{ copied() ? 'Copié' : 'Copier PGN' }}
      </button>
    </div>
  </div>

  @if (moves().length) {
    <ol class="moves">
      @for (move of moves(); track $index) {
        <li [class.current]="$index === currentIndex() - 1">{{ move }}</li>
      }
    </ol>
  } @else {
    <p class="empty">Joue un coup ou lance la demo 1. e4.</p>
  }

</section>
