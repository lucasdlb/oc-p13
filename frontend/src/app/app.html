<main class="app-shell">
  <header class="top-bar">
    <div class="brand-block">
      <p class="eyebrow">POC Agent d'ouvertures FFE</p>
      <h1>Analyse d'ouverture</h1>
      <p class="intro">
        Echiquier, coach source et statistiques dans une vue de demonstration compacte.
      </p>
    </div>

    <div class="top-actions">
      <app-level-selector [level]="level()" (levelChange)="setLevel($event)" />
      <div class="buttons">
        <button type="button" class="primary" (click)="playDemoMove()">Demo 1. e4</button>
        <button type="button" class="secondary" (click)="reset()">Reinitialiser</button>
      </div>
    </div>
  </header>

  <section class="workspace">
    <app-analysis-panel
      [analysis]="analysis()"
      [fen]="fen()"
      [ratingMin]="ratingMin()"
      [ratingMax]="ratingMax()"
      [ratingBuckets]="ratingBuckets"
      (ratingMinChange)="setRatingMin($event)"
      (ratingMaxChange)="setRatingMax($event)"
      [loading]="loading()"
      [error]="error()"
    />

    <div class="board-column">
      <app-chessboard
        [fen]="fen()"
        [dests]="legalDests()"
        (moveRequested)="onMoveRequested($event)"
      />
      <app-move-history
        [moves]="line()"
        [fen]="fen()"
        [pgn]="pgn()"
        [currentIndex]="currentIndex()"
        [totalMoves]="totalMoves()"
        (goBack)="goBack()"
        (goForward)="goForward()"
      />
    </div>
  </section>
</main>
