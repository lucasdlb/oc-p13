# POC Agent d'ouvertures FFE — pile locale.
# MongoDB est le seul service conteneurise pour l'instant : les services backend
# et frontend arrivent avec la phase Docker Compose complet (docs/PLAN.md, jour 11).

services:
  mongodb:
    image: mongo:8
    container_name: p13-mongodb
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
